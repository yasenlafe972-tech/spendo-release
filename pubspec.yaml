name: sanad_app
description: "Spendo - Advanced Personal & Worker Management Application"
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  crypto: ^3.0.6
  firebase_core: ^3.10.1
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.2
  arabic_reshaper: ^0.0.1
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  shared_preferences: ^2.5.6
  image_picker: ^1.1.2
  remixicon: ^4.9.3
  geolocator: ^14.1.2
  file_picker: ^13.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
